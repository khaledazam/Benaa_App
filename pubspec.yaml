name: benaa_flutter_mobile
description: "A mobile application for warehouse stock inventory receiving, auditing, and local management."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Data & Offline Storage
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  uuid: ^4.3.3

  # State Management & Helpers
  provider: ^6.1.1
  intl: ^0.20.3
  http: ^1.2.0

  # UI & Styling
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6

  # Hardware & Device Integration
  mobile_scanner: ^5.2.3
  vibration: ^2.0.0
  flutter_local_notifications: ^17.2.2
  geolocator: ^12.0.0
  nfc_manager: ^3.3.0
  blue_thermal_printer: ^1.2.3
  local_auth: ^2.2.0
  pdf: ^3.10.8
  printing: ^5.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
